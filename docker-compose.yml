version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: forgepilot-db
    restart: always
    environment:
      POSTGRES_USER: forge_admin
      POSTGRES_PASSWORD: forge_secret_pass
      POSTGRES_DB: forgepilot
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
